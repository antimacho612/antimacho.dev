<div class="controls">
  <label>
    最小幅
    <input type="range" id="min-width" min="80" max="240" value="140" step="10" />
    <output id="min-width-value">140px</output>
  </label>
  <label>
    <input type="checkbox" id="auto-fill" />
    auto-fill にする
  </label>
</div>

<div class="grid" id="grid">
  <div class="cell">1</div>
  <div class="cell">2</div>
  <div class="cell">3</div>
  <div class="cell">4</div>
  <div class="cell">5</div>
</div>
